name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 卦表自校验
        run: python tools/gen_hexagrams.py --check

      - name: 辞库结构与覆盖
        run: python tools/build_corpus.py --check

      - name: 生成物与源数据一致
        run: |
          python tools/gen_gua_jing.py
          python tools/gen_yao_zhen.py
          python tools/build_corpus.py
          node tools/build_web.mjs
          git diff --exit-code examples/ data/corpus.json docs/index.html

      - name: 测试（含 C 轨迹等价）
        run: node --test

      - name: C 后端零警告编译
        run: |
          node bin/yao.js build examples/gua-jing/gua_jing.yao --main -o /tmp/gua.c
          gcc -std=c99 -Wall -Wextra -Werror /tmp/gua.c -o /tmp/gua
          printf '1 1\n2 2\nq\n' | /tmp/gua

      - name: 地牢验证
        run: node bin/yao.js check examples/gua-jing/gua_jing.yao --strict

      - name: 爻阵验证
        run: node bin/yao.js check examples/yao-zhen/yao_zhen.yao --strict

      - name: 交通灯（爻 → C → C 宿主）
        run: |
          # 生成的 traffic.h 与 host.c 必须同目录：host.c 用的是引号包含
          mkdir -p /tmp/yj && cd /tmp/yj
          node "$GITHUB_WORKSPACE/bin/yao.js" build \
            "$GITHUB_WORKSPACE/examples/traffic/traffic.yao" --header -o traffic.c
          cp "$GITHUB_WORKSPACE/examples/traffic/host.c" .
          gcc -std=c99 -Wall -Wextra -Werror traffic.c host.c -o traffic
          ./traffic | tee out.txt
          grep -q 'EW_GREEN' out.txt
          grep -q '行人按钮' out.txt
